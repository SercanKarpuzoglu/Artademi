server:
  # Port da env'den okunur; varsayilan 8081 (Keycloak 8080'de kalsin).
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: artademi-backend

  # Gmail SMTP (Google Workspace, app password ile). Kimlik bilgisi YALNIZCA env'den;
  # bos ise mail gonderimi devre disi (lead ucu 503 doner, uygulama ayaga kalkar).
  mail:
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  security:
    oauth2:
      resourceserver:
        jwt:
          # Keycloak realm issuer'i; jwk-set-uri bu issuer'dan otomatik kesfedilir.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/Artademi}

# Keycloak Admin REST API (service account) — kullanici yonetimi modulu (com.artademi.user).
# Sir KODA GOMULMEZ; admin-client-secret yalnizca ortam degiskeninden gelir (varsayilan YOK).
artademi:
  # Landing iletisim formu (lead) mail hedefi — info@ grubu (Google Workspace).
  mail:
    lead-to: ${LEAD_MAIL_TO:info@artademi.com}
    from: ${LEAD_MAIL_FROM:info@artademi.com}

  keycloak:
    base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
    realm: ${KEYCLOAK_REALM:Artademi}
    admin-client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:artademi-backend}
    admin-client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    # Kullanici parolasini dogrulamak icin kullanilan public client (Direct Access Grants).
    app-client-id: ${KEYCLOAK_APP_CLIENT_ID:artademi-app}

  # Odeme entegrasyonu (iyzico) — sirlar YALNIZCA ortam degiskeninden; bos ise checkout 409 doner
  # (uygulama anahtarsiz ayaga kalkar; testlerde saglayici mock'lanir).
  billing:
    web-return-url: ${BILLING_WEB_RETURN_URL:http://localhost:5173/abonelik}
    iyzico:
      base-url: ${IYZICO_BASE_URL:https://sandbox-api.iyzipay.com}
      api-key: ${IYZICO_API_KEY:}
      secret-key: ${IYZICO_SECRET_KEY:}
      merchant-id: ${IYZICO_MERCHANT_ID:}
      pricing-plan-reference-code: ${IYZICO_PLAN_REF:}
      callback-url: ${IYZICO_CALLBACK_URL:http://localhost:8081/api/billing/callback}

  datasource:
    # Baglanti bilgileri ortam degiskeninden gelir. Parola icin VARSAYILAN YOK.
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/artademi}
    username: ${SPRING_DATASOURCE_USERNAME:artademi}
    password: ${SPRING_DATASOURCE_PASSWORD}

  jpa:
    hibernate:
      # Semayi Flyway yonetir; Hibernate yalnizca dogrular.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

# Actuator: yalnizca health endpoint acik.
management:
  # Mail SMTP kontrolu health'e DAHIL EDILMEZ: lead maili best-effort'tur; Gmail'e anlik
  # erisilemezse uygulama "unhealthy" gorunmemeli (ayrica testte mock sender ile patlar).
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      access: read-only
